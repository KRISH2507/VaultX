version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultx_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vaultx_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaultx} -d ${POSTGRES_DB:-vaultx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultx_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: vaultx_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-vaultx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vaultx_secret}
      - POSTGRES_DB=${POSTGRES_DB:-vaultx_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vaultx}:${POSTGRES_PASSWORD:-vaultx_secret}@postgres:5432/${POSTGRES_DB:-vaultx_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: vaultx_celery_worker
    restart: always
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -c 4
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-vaultx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vaultx_secret}
      - POSTGRES_DB=${POSTGRES_DB:-vaultx_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vaultx}:${POSTGRES_PASSWORD:-vaultx_secret}@postgres:5432/${POSTGRES_DB:-vaultx_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: vaultx_celery_beat
    restart: always
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
